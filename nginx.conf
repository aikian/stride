server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/html application/javascript application/manifest+json text/css;
  types { application/manifest+json webmanifest; }

  # 앱 본문·서비스 워커는 항상 최신 버전을 확인하게 한다.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/"; }
  location ~* \.(png|webmanifest)$ { add_header Cache-Control "public, max-age=604800"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
